[project]
name = "small-cap-workbench"
version = "1.1.0"
description = "Small cap quantitative strategy research workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.20.2",
  "pandas>=2.1.0",
  "numpy>=2.0.0,<2.3",
  "scipy>=1.15.0",
  "jinja2>=3.0.0",
  "fastapi>=0.160.0",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.setuptools.package-data]
backend = []

[tool.uv]
package = false
